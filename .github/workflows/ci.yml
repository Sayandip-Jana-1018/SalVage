name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.7"

jobs:
  # --------------------------------------------------------------------------
  # Contracts. Runs first and alone because everything else depends on the
  # wire formats being valid and matching what the services actually serve.
  # --------------------------------------------------------------------------
  contracts:
    name: Contracts (drift gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Validate schemas and check implementation drift
        run: bash scripts/check-contracts.sh

  # --------------------------------------------------------------------------
  # Python
  # --------------------------------------------------------------------------
  python:
    name: salvage-brain (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/salvage-brain
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/salvage-brain/uv.lock
      - name: Install (locked)
        # --frozen fails if uv.lock is stale rather than silently resolving
        # something other than what was tested locally.
        run: uv sync --frozen --all-extras --group dev
      - name: Ruff
        run: uv run --frozen ruff check src tests
      - name: Mypy (strict)
        run: uv run --frozen mypy src
      - name: Tests
        # Docker is present on GitHub-hosted ubuntu runners, so the
        # Testcontainers-backed integration tests run here too.
        run: uv run --frozen pytest tests -q

  # --------------------------------------------------------------------------
  # Java
  # --------------------------------------------------------------------------
  java:
    name: salvage-core (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/salvage-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless
        run: ./gradlew --no-daemon spotlessCheck
      - name: Tests
        # Testcontainers starts PostgreSQL, Redis and Redpanda against the
        # runner's Docker daemon. No `services:` block is needed and adding a
        # docker:dind service (as an earlier version of this workflow did)
        # accomplishes nothing.
        run: ./gradlew --no-daemon test
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salvage-core-test-report
          path: services/salvage-core/build/reports/tests/test
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # The acceptance test: the demo a stranger is told to run must actually run.
  # --------------------------------------------------------------------------
  demo:
    name: End-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make demo
        run: make demo
      - name: Diagnostics on failure
        if: failure()
        run: docker compose --profile apps logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose --profile apps down -v --remove-orphans
