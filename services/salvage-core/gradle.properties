# Portable Gradle settings only.
#
# There is deliberately NO `org.gradle.java.home` here. Pinning an absolute
# JDK path in a committed file breaks the build on every machine that is not
# the one it was written on, including CI. The JDK is selected by the Gradle
# toolchain declaration in build.gradle.kts (Java 21) and auto-provisioned by
# the foojay resolver configured in settings.gradle.kts when no local JDK 21
# is found. Developers who want to force a specific JDK should set
# `org.gradle.java.home` in ~/.gradle/gradle.properties, which is not committed.

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
