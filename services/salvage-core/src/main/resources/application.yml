# ---- server ----------------------------------------------------------------
server:
  # The port the process listens on. Distinct from CORE_HOST_PORT in
  # docker-compose.yml, which is the port published on the host.
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: salvage-core

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ---- datasource ----------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:salvage}
    username: ${POSTGRES_USER:salvage}
    password: ${POSTGRES_PASSWORD:salvage_local_dev_only}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      leak-detection-threshold: 30000
      # Transactions are demarcated explicitly. Autocommit on a pooled
      # connection is how a "single transaction" silently becomes several,
      # which is precisely the bug the outbox pattern exists to prevent.
      auto-commit: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: salvage
        jdbc:
          time_zone: UTC

  # ---- flyway --------------------------------------------------------------
  flyway:
    enabled: true
    schemas:
      - salvage
    locations:
      - classpath:db/migration
    baseline-on-migrate: false

  # ---- redis ---------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

  # ---- kafka ---------------------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
    consumer:
      group-id: salvage-core
      auto-offset-reset: earliest
      # Offsets are committed by the listener after the handler returns, so a
      # crash mid-handler redelivers rather than silently skipping.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The idempotent producer is not optional in this system. Without it a
      # producer-side retry after a network blip can write the same record
      # twice, and "never originate a duplicate" would be false at the very
      # first hop. Requires acks=all and max in-flight <= 5.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000

# ---- actuator --------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Never expose dependency detail on an unauthenticated endpoint. Driver
      # exception messages embed connection URLs, which embed credentials.
      # The detailed view lives at /health/readiness, which returns exception
      # types only, and in the logs.
      show-details: never
      show-components: never
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true

# ---- salvage ---------------------------------------------------------------
salvage:
  demo-ingest:
    # Lets the operator console publish a real payment_failed.v1 event through
    # the ordinary Kafka path, so its checkout page drives the actual pipeline
    # rather than animating one.
    #
    # This is a write endpoint: events published through it are attributed to a
    # merchant and cause decisions to be recorded against that merchant. It is
    # off unless switched on, and it should stay off anywhere shared.
    enabled: ${SALVAGE_DEMO_INGEST_ENABLED:false}

  payment:
    # Which adapter the PaymentProvider port resolves to.
    #
    #   simulated  the default. Deterministic, in-process, no credentials, no
    #              network. `make demo` and CI use this, and the quickstart
    #              works with it for someone who has just cloned the repo.
    #   razorpay   real HTTP against Razorpay. Requires RAZORPAY_KEY_ID and
    #              RAZORPAY_KEY_SECRET; the process refuses to start without
    #              them rather than silently falling back to the simulator,
    #              because an operator who asked for a gateway and got a
    #              simulation would be told about recoveries that never
    #              happened.
    provider: ${SALVAGE_PAYMENT_PROVIDER:simulated}

    simulated:
      # Outcomes are a pure function of this seed and the caller's idempotency
      # key, so a run replays bit-identically.
      seed: ${SALVAGE_SIM_SEED:20260831}

      # STRUCTURAL ASSUMPTIONS, NOT MEASUREMENTS. Chosen so that a short run
      # exercises every branch of the calling code, including the rare and
      # dangerous one. Nothing here has measured a real gateway's rates; see
      # docs/adr/0006-numbers-policy.md.
      success-rate: ${SALVAGE_SIM_SUCCESS_RATE:0.55}

      # Share of calls that return UNKNOWN -- the caller learns nothing.
      timeout-rate: ${SALVAGE_SIM_TIMEOUT_RATE:0.10}

      # Of those timeouts, the share that actually captured the money. This is
      # the double-charge scenario: the caller saw a timeout, the customer was
      # charged, and only a reconciliation read can tell the difference.
      timeout-captured-rate: ${SALVAGE_SIM_TIMEOUT_CAPTURED_RATE:0.30}

  razorpay:
    # Read by ProviderCredentialsGuard, which refuses to start on a key
    # beginning `rzp_live_` whatever the provider setting says. That guard is
    # independent of the adapter on purpose: it is the control that stops the
    # system from being pointed at live money by accident.
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

    # Used to verify the HMAC-SHA256 signature on inbound webhooks. Without
    # it, verification fails closed and every webhook is rejected -- which is
    # the correct behaviour for an unauthenticated write into the money
    # pipeline.
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}

# ---- logging ---------------------------------------------------------------
logging:
  level:
    root: INFO
    com.salvage: INFO
