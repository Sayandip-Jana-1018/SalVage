[project]
name = "salvage-brain"
version = "0.1.0"
description = "Salvage decision service - ML-driven payment failure diagnosis and recovery policy."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.14.0,<2.0",
    # psycopg 3, not psycopg2-binary. psycopg2-binary ships its own statically
    # linked libpq and its maintainers explicitly discourage it outside
    # development; psycopg 3 is the maintained line and has first-class
    # SQLAlchemy 2 support. The DSN in config.py names the driver explicitly.
    "psycopg[binary]>=3.2.3,<4.0",
    "redis>=5.2.0,<6.0",
    # confluent-kafka wraps librdkafka, the same C client the rest of the
    # ecosystem uses. It is the only Kafka client here; the pure-Python
    # alternatives are slower and less complete on consumer group handling.
    "confluent-kafka>=2.6.0,<3.0",
    "httpx>=0.28.0,<1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Not installed by default. The ML stack is heavy and nothing in Phase 0
# imports it; it is declared here so the Phase 3/4 dependency set is visible.
ml = [
    "lightgbm>=4.5.0,<5.0",
    "scikit-learn>=1.6.0,<2.0",
    "ruptures>=1.1.9,<2.0",
    "numpy>=2.2.0,<3.0",
    "pandas>=2.2.0,<3.0",
    "polars>=1.17.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.25.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "hypothesis>=6.120.0,<7.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "testcontainers[postgres,redis]>=4.9.0,<5.0",
    # Used by scripts/check_contracts.py, the ADR-0002 drift gate.
    "jsonschema>=4.23.0,<5.0",
    "openapi-spec-validator>=0.7.1,<1.0",
    "pyyaml>=6.0.2,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salvage_brain"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["salvage_brain"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
# The point of strict mode is that untyped third-party stubs are visible
# rather than silently ignored. Where a library genuinely ships no types, it
# is listed explicitly below so the exception is auditable instead of blanket.
[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker (Testcontainers). Deselect with -m 'not integration'.",
]
