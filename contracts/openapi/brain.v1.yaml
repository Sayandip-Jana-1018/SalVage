openapi: "3.1.0"
info:
  title: Salvage Brain API
  version: "0.1.0"
  description: |
    The decision service for Salvage. This service never moves money. It
    returns a recommended action and its reasoning; salvage-core decides
    whether to execute it.

    Phase 4 exposes health probes, read path over ingested payment attempts,
    real-time rail health sensing, failure diagnosis, and the Recoverability &
    Policy Decision Engine.

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /healthz/liveness:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Returns 200 if the process is alive. Deliberately does not check
        downstream dependencies - that is readiness.
      tags: [health]
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /healthz/readiness:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 only if the service round-trips PostgreSQL, Redis, and
        Kafka. A 503 means the process is alive but should not receive
        traffic.
      tags: [health]
      responses:
        "200":
          description: Ready - all dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Not ready - at least one dependency unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/attempts/{merchant_id}/{payment_attempt_id}:
    get:
      operationId: getAttempt
      summary: Read one payment attempt and the failures observed on it
      description: |
        The read path that the Phase 3 feature store is built on. Scoped by
        merchant: an attempt is not reachable through another merchant's id,
        which returns 404 rather than 403 so that the endpoint does not
        confirm the existence of another tenant's data.
      tags: [attempts]
      parameters:
        - name: merchant_id
          in: path
          required: true
          schema:
            type: string
        - name: payment_attempt_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The attempt, with its failure events in time order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptView"
        "404":
          description: No such attempt for this merchant
        "422":
          description: Malformed path parameters

  /v1/diagnose:
    post:
      operationId: diagnoseAttempt
      summary: Diagnose a payment failure and infer root cause
      description: |
        Runs the Sense & Diagnose engine across failure events, systemic rail
        health, and customer history. Returns normalized taxonomy code, calibrated
        confidence, explainability tokens, and recommended recovery tag.
      tags: [diagnosis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosisRequest"
      responses:
        "200":
          description: Diagnosis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisResponse"
        "404":
          description: No such attempt for this merchant
        "422":
          description: Malformed request payload

  /v1/decide:
    post:
      operationId: decideRecoveryAction
      summary: Decide optimal recovery action using expected net utility optimization
      description: |
        Evaluates candidate recovery actions (immediate retry, smart scheduled retry,
        rail switch, customer nudge, NO-OP) using causal recoverability models and
        expected monetary payoff minus costs.
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDecisionRequest"
      responses:
        "200":
          description: Policy decision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionResponse"
        "404":
          description: No such attempt for this merchant
        "422":
          description: Malformed request payload

  /v1/sensing/rails:
    get:
      operationId: getRailHealthMatrix
      summary: Read real-time health matrix for all active payment rails
      description: |
        Returns sliding-window health snapshots, degradation status, success
        rates, and failure velocities across monitored payment rails.
      tags: [sensing]
      responses:
        "200":
          description: Active rail health matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RailHealthMatrix"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CheckResult"

    CheckResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        latency_ms:
          type: number
          format: float
          description: Round-trip time to the dependency in milliseconds.
        reason:
          type: string
          description: |
            Exception type when status is down. Deliberately not the exception
            message: this endpoint is unauthenticated and driver messages embed
            connection URLs, which embed credentials.

    FailureSummary:
      type: object
      required: [event_id, provider_error_code, rail_id, event_timestamp]
      properties:
        event_id:
          type: string
          format: uuid
        provider_error_code:
          type: string
        rail_id:
          type: string
          description: issuer|payment_method|provider - the unit of health monitoring.
        event_timestamp:
          type: string
          format: date-time
        taxonomy_code:
          type: [string, "null"]
          description: Standardized taxonomy classification.

    AttemptView:
      type: object
      required:
        - merchant_id
        - order_id
        - payment_attempt_id
        - amount_paise
        - currency
        - payment_method
        - provider
        - issuer
        - is_recurring
        - created_at
        - failures
      properties:
        merchant_id:
          type: string
        order_id:
          type: string
        payment_attempt_id:
          type: string
        amount_paise:
          type: integer
          description: Amount in the smallest currency unit (paise for INR).
        currency:
          type: string
        payment_method:
          type: string
        provider:
          type: string
        issuer:
          type: string
        is_recurring:
          type: boolean
        created_at:
          type: string
          format: date-time
        failures:
          type: array
          items:
            $ref: "#/components/schemas/FailureSummary"

    DiagnosisRequest:
      type: object
      required:
        - merchant_id
        - payment_attempt_id
      properties:
        merchant_id:
          type: string
        payment_attempt_id:
          type: string
        observation_timestamp:
          type: string
          format: date-time
          description: Optional point-in-time timestamp for historical backtesting.

    DiagnosisResponse:
      type: object
      required:
        - payment_attempt_id
        - taxonomy_code
        - confidence
        - root_cause
        - rail_id
        - rail_state
        - explainability_tokens
        - suggested_action
        - diagnosed_at
      properties:
        payment_attempt_id:
          type: string
        taxonomy_code:
          type: string
          enum:
            - INSUFFICIENT_FUNDS
            - ISSUER_OUTAGE
            - NETWORK_TIMEOUT
            - MANDATE_INVALID
            - CARD_EXPIRED
            - RISK_DECLINE
            - CUSTOMER_ABANDONED
            - UNKNOWN
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        root_cause:
          type: string
        rail_id:
          type: string
        rail_state:
          type: string
          enum: [HEALTHY, DEGRADED, DOWN]
        explainability_tokens:
          type: array
          items:
            type: string
        suggested_action:
          type: string
          enum:
            - RETRY_IMMEDIATE
            - RETRY_SMART_SCHEDULE
            - SWITCH_RAIL
            - CUSTOMER_NUDGE
            - NO_ACTION
        diagnosed_at:
          type: string
          format: date-time

    PolicyDecisionRequest:
      type: object
      required:
        - merchant_id
        - payment_attempt_id
      properties:
        merchant_id:
          type: string
        payment_attempt_id:
          type: string
        observation_timestamp:
          type: string
          format: date-time
          description: Optional point-in-time timestamp for backtesting and evaluation.

    ActionValuation:
      type: object
      required:
        - action
        - recovery_probability
        - gross_expected_value_paise
        - estimated_cost_paise
        - net_expected_value_paise
      properties:
        action:
          type: string
          enum:
            - RETRY_IMMEDIATE
            - RETRY_SCHEDULED
            - SWITCH_RAIL
            - CUSTOMER_NUDGE
            - NO_ACTION
        recovery_probability:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        gross_expected_value_paise:
          type: integer
        estimated_cost_paise:
          type: integer
        net_expected_value_paise:
          type: integer

    PolicyDecisionResponse:
      type: object
      required:
        - payment_attempt_id
        - chosen_action
        - recovery_probability
        - expected_net_value_paise
        - target_rail_id
        - scheduled_delay_seconds
        - nudge_channel
        - reasoning_tokens
        - candidate_valuations
        - decided_at
      properties:
        payment_attempt_id:
          type: string
        chosen_action:
          type: string
          enum:
            - RETRY_IMMEDIATE
            - RETRY_SCHEDULED
            - SWITCH_RAIL
            - CUSTOMER_NUDGE
            - NO_ACTION
        recovery_probability:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        expected_net_value_paise:
          type: integer
        target_rail_id:
          type: [string, "null"]
        scheduled_delay_seconds:
          type: [integer, "null"]
        nudge_channel:
          type: [string, "null"]
          enum: [WHATSAPP, SMS, EMAIL, null]
        reasoning_tokens:
          type: array
          items:
            type: string
        candidate_valuations:
          type: array
          items:
            $ref: "#/components/schemas/ActionValuation"
        decided_at:
          type: string
          format: date-time

    RailHealthView:
      type: object
      required:
        - rail_id
        - state
        - success_rate_5m
        - failure_velocity_5m
        - last_evaluated_at
      properties:
        rail_id:
          type: string
        state:
          type: string
          enum: [HEALTHY, DEGRADED, DOWN]
        success_rate_5m:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        failure_velocity_5m:
          type: number
          format: float
          description: Failures per minute over the past 5 minutes.
        last_evaluated_at:
          type: string
          format: date-time

    RailHealthMatrix:
      type: object
      required:
        - timestamp
        - rails
      properties:
        timestamp:
          type: string
          format: date-time
        rails:
          type: array
          items:
            $ref: "#/components/schemas/RailHealthView"
