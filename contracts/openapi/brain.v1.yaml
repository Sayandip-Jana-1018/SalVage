openapi: "3.1.0"
info:
  title: Salvage Brain API
  version: "0.1.0"
  description: |
    The decision service for Salvage. This service never moves money. It
    returns a recommended action and its reasoning; salvage-core decides
    whether to execute it.

    Phase 4 exposes health probes, read path over ingested payment attempts,
    real-time rail health sensing, failure diagnosis, and the Recoverability &
    Policy Decision Engine.

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /healthz/liveness:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Returns 200 if the process is alive. Deliberately does not check
        downstream dependencies - that is readiness.
      tags: [health]
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /healthz/readiness:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 only if the service round-trips PostgreSQL, Redis, and
        Kafka. A 503 means the process is alive but should not receive
        traffic.
      tags: [health]
      responses:
        "200":
          description: Ready - all dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Not ready - at least one dependency unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/attempts/{merchant_id}:
    get:
      operationId: listAttempts
      summary: List the most recent payment attempts for one tenant
      description: |
        Bounded and tenant-scoped, like every other read here. There is no
        cross-tenant listing and no unbounded one. An out-of-range limit is
        rejected rather than clamped: clamping answers a different question
        than the caller asked and labels the result with the limit they
        requested.
      tags: [attempts]
      parameters:
        - name: merchant_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: A page of attempts, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptPage"
        "422":
          description: limit out of range

  /v1/attempts/{merchant_id}/{payment_attempt_id}:
    get:
      operationId: getAttempt
      summary: Read one payment attempt and the failures observed on it
      description: |
        The read path that the Phase 3 feature store is built on. Scoped by
        merchant: an attempt is not reachable through another merchant's id,
        which returns 404 rather than 403 so that the endpoint does not
        confirm the existence of another tenant's data.
      tags: [attempts]
      parameters:
        - name: merchant_id
          in: path
          required: true
          schema:
            type: string
        - name: payment_attempt_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The attempt, with its failure events in time order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptView"
        "404":
          description: No such attempt for this merchant
        "422":
          description: Malformed path parameters

  /v1/diagnose:
    post:
      operationId: diagnoseAttempt
      summary: Diagnose a payment failure and infer root cause
      description: |
        Runs the Sense & Diagnose engine across failure events, systemic rail
        health, and customer history. Returns normalized taxonomy code, calibrated
        confidence, explainability tokens, and recommended recovery tag.
      tags: [diagnosis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosisRequest"
      responses:
        "200":
          description: Diagnosis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisResponse"
        "404":
          description: No such attempt for this merchant
        "422":
          description: Malformed request payload

  /v1/decide:
    post:
      operationId: decideRecoveryAction
      summary: Decide optimal recovery action using expected net utility optimization
      description: |
        Evaluates candidate recovery actions (immediate retry, smart scheduled retry,
        rail switch, customer nudge, NO-OP) using causal recoverability models and
        expected monetary payoff minus costs.
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDecisionRequest"
      responses:
        "200":
          description: Policy decision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionResponse"
        "404":
          description: No such attempt for this merchant
        "422":
          description: Malformed request payload

  /v1/sensing/rails:
    get:
      operationId: getRailHealthMatrix
      summary: Read real-time health matrix for all active payment rails
      description: |
        Returns sliding-window health snapshots, degradation status, success
        rates, and failure velocities across monitored payment rails.
      tags: [sensing]
      responses:
        "200":
          description: Active rail health matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RailHealthMatrix"

  /v1/language/status:
    get:
      operationId: getLanguageStatus
      summary: Whether the language layer is switched on, and against which model
      description: |
        Answers 200 even when the layer is disabled. "Switched off" and
        "broken" are different facts and a console has to render them
        differently; an endpoint that 503s for both makes them
        indistinguishable. Carries no credential.
      tags: [language]
      responses:
        "200":
          description: The configured state of the language layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageStatus"

  /v1/language/triage:
    post:
      operationId: triageUnknownDeclineCode
      summary: Propose a taxonomy mapping for an unrecognised provider error code
      description: |
        For codes the deterministic mapper cannot resolve. The result is a
        **proposal for human review**; it is never applied. `applied` is a
        literal false on the response schema, and no code in this repository
        writes to the mapper table.

        A code the mapper already resolves is refused with 409 rather than
        re-examined: consulting a model about an answer you already have is how
        a verified mapping gets quietly overwritten by a plausible one.
      tags: [language]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageRequest"
      responses:
        "200":
          description: A proposal, pending human review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageResponse"
        "409":
          description: The deterministic mapper already resolves this code
        "422":
          description: Malformed request payload
        "502":
          description: The model answered with something that failed validation
        "503":
          description: The language layer is disabled or the provider did not answer

  /v1/language/nudge-copy:
    post:
      operationId: writeNudgeCopy
      summary: Write customer nudge copy for an action the policy engine chose
      description: |
        The policy decides whether to contact a customer; this writes the
        sentence. The model may not write a digit -- it produces a template
        containing `{amount}` and `{merchant}`, and the service substitutes
        them, formatting the amount from integer paise. Generating copy does
        not send it; nothing in salvage-brain has an outbound channel to a
        customer.
      tags: [language]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NudgeRequest"
      responses:
        "200":
          description: The generated template and the message it renders to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NudgeCopy"
        "422":
          description: Malformed request payload, or a language outside the supported set
        "502":
          description: The generated copy failed validation and was refused
        "503":
          description: The language layer is disabled or the provider did not answer

  /v1/language/narrate:
    post:
      operationId: narrateDecisionChain
      summary: Narrate one decision chain in English for an operator
      description: |
        Read-only, over facts this service fetches itself from its own read
        path rather than accepting from the caller. Every number in the
        narration must already appear in those facts; a narration that
        introduces one is rejected with 502.
      tags: [language]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NarrationRequest"
      responses:
        "200":
          description: The narration, with the model and prompt digest that produced it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Narration"
        "404":
          description: No such attempt for this merchant
        "422":
          description: Malformed request payload
        "502":
          description: The narration failed validation and was refused
        "503":
          description: The language layer is disabled or the provider did not answer


components:
  schemas:
    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CheckResult"

    CheckResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        latency_ms:
          type: number
          format: float
          description: Round-trip time to the dependency in milliseconds.
        reason:
          type: string
          description: |
            Exception type when status is down. Deliberately not the exception
            message: this endpoint is unauthenticated and driver messages embed
            connection URLs, which embed credentials.

    FailureSummary:
      type: object
      required: [event_id, provider_error_code, rail_id, event_timestamp]
      properties:
        event_id:
          type: string
          format: uuid
        provider_error_code:
          type: string
        rail_id:
          type: string
          description: issuer|payment_method|provider - the unit of health monitoring.
        event_timestamp:
          type: string
          format: date-time
        taxonomy_code:
          type: [string, "null"]
          description: Standardized taxonomy classification.

    AttemptView:
      type: object
      required:
        - merchant_id
        - order_id
        - payment_attempt_id
        - amount_paise
        - currency
        - payment_method
        - provider
        - issuer
        - is_recurring
        - created_at
        - failures
      properties:
        merchant_id:
          type: string
        order_id:
          type: string
        payment_attempt_id:
          type: string
        amount_paise:
          type: integer
          description: Amount in the smallest currency unit (paise for INR).
        currency:
          type: string
        payment_method:
          type: string
        provider:
          type: string
        issuer:
          type: string
        is_recurring:
          type: boolean
        created_at:
          type: string
          format: date-time
        failures:
          type: array
          items:
            $ref: "#/components/schemas/FailureSummary"

    DiagnosisRequest:
      type: object
      required:
        - merchant_id
        - payment_attempt_id
      properties:
        merchant_id:
          type: string
        payment_attempt_id:
          type: string
        observation_timestamp:
          type: string
          format: date-time
          description: Optional point-in-time timestamp for historical backtesting.

    DiagnosisResponse:
      type: object
      required:
        - payment_attempt_id
        - taxonomy_code
        - confidence
        - root_cause
        - rail_id
        - rail_state
        - explainability_tokens
        - suggested_action
        - diagnosed_at
      properties:
        payment_attempt_id:
          type: string
        taxonomy_code:
          type: string
          enum:
            - INSUFFICIENT_FUNDS
            - ISSUER_OUTAGE
            - NETWORK_TIMEOUT
            - MANDATE_INVALID
            - CARD_EXPIRED
            - RISK_DECLINE
            - CUSTOMER_ABANDONED
            - UNKNOWN
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        root_cause:
          type: string
        rail_id:
          type: string
        rail_state:
          type: string
          enum: [HEALTHY, DEGRADED, DOWN]
        explainability_tokens:
          type: array
          items:
            type: string
        suggested_action:
          type: string
          enum:
            - RETRY_IMMEDIATE
            - RETRY_SMART_SCHEDULE
            - SWITCH_RAIL
            - CUSTOMER_NUDGE
            - NO_ACTION
        diagnosed_at:
          type: string
          format: date-time

    PolicyDecisionRequest:
      type: object
      required:
        - merchant_id
        - payment_attempt_id
      properties:
        merchant_id:
          type: string
        payment_attempt_id:
          type: string
        observation_timestamp:
          type: string
          format: date-time
          description: Optional point-in-time timestamp for backtesting and evaluation.

    ActionValuation:
      type: object
      required:
        - action
        - recovery_probability
        - gross_expected_value_paise
        - estimated_cost_paise
        - net_expected_value_paise
      properties:
        action:
          type: string
          enum:
            - RETRY_IMMEDIATE
            - RETRY_SCHEDULED
            - SWITCH_RAIL
            - CUSTOMER_NUDGE
            - NO_ACTION
        recovery_probability:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        gross_expected_value_paise:
          type: integer
        estimated_cost_paise:
          type: integer
        net_expected_value_paise:
          type: integer

    PolicyDecisionResponse:
      type: object
      required:
        - payment_attempt_id
        - chosen_action
        - recovery_probability
        - expected_net_value_paise
        - target_rail_id
        - scheduled_delay_seconds
        - nudge_channel
        - reasoning_tokens
        - candidate_valuations
        - decided_at
      properties:
        payment_attempt_id:
          type: string
        chosen_action:
          type: string
          enum:
            - RETRY_IMMEDIATE
            - RETRY_SCHEDULED
            - SWITCH_RAIL
            - CUSTOMER_NUDGE
            - NO_ACTION
        recovery_probability:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        expected_net_value_paise:
          type: integer
        target_rail_id:
          type: [string, "null"]
        scheduled_delay_seconds:
          type: [integer, "null"]
        nudge_channel:
          type: [string, "null"]
          enum: [WHATSAPP, SMS, EMAIL, null]
        reasoning_tokens:
          type: array
          items:
            type: string
        candidate_valuations:
          type: array
          items:
            $ref: "#/components/schemas/ActionValuation"
        decided_at:
          type: string
          format: date-time

    RailHealthView:
      type: object
      required:
        - rail_id
        - state
        - success_rate_5m
        - failure_velocity_5m
        - last_evaluated_at
      properties:
        rail_id:
          type: string
        state:
          type: string
          enum: [HEALTHY, DEGRADED, DOWN]
        success_rate_5m:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        failure_velocity_5m:
          type: number
          format: float
          description: Failures per minute over the past 5 minutes.
        last_evaluated_at:
          type: string
          format: date-time

    RailHealthMatrix:
      type: object
      required:
        - timestamp
        - rails
      properties:
        timestamp:
          type: string
          format: date-time
        rails:
          type: array
          items:
            $ref: "#/components/schemas/RailHealthView"

    AttemptSummary:
      type: object
      required:
        - merchant_id
        - payment_attempt_id
        - order_id
        - amount_paise
        - currency
        - payment_method
        - issuer
        - created_at
        - failure_count
      properties:
        merchant_id:
          type: string
        payment_attempt_id:
          type: string
        order_id:
          type: string
        amount_paise:
          type: integer
          description: Money is an integer count of paise everywhere in this system.
        currency:
          type: string
        payment_method:
          type: string
        issuer:
          type: string
        created_at:
          type: string
          format: date-time
        failure_count:
          type: integer

    AttemptPage:
      type: object
      required: [merchant_id, limit, attempts]
      properties:
        merchant_id:
          type: string
        limit:
          type: integer
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/AttemptSummary"

    LanguageStatus:
      type: object
      required: [enabled, model, review_queue_configured, money_path]
      properties:
        enabled:
          type: boolean
          description: False on a fresh clone. A key on its own does not switch it on.
        model:
          type: string
        review_queue_configured:
          type: boolean
        money_path:
          type: string
          description: |
            A standing statement that no route in this service executes a
            recovery action. On the wire so a client cannot imply otherwise by
            omission.

    TriageRequest:
      type: object
      required: [provider_error_code]
      properties:
        provider_error_code:
          type: string
          maxLength: 64
        provider_error_description:
          type: [string, "null"]
          maxLength: 500

    TriageProposal:
      type: object
      required:
        - proposed_taxonomy_code
        - is_retryable_same_rail
        - is_retryable_alternative_rail
        - rationale
        - specification_to_check
      properties:
        proposed_taxonomy_code:
          type: string
          enum:
            - INSUFFICIENT_FUNDS
            - ISSUER_OUTAGE
            - NETWORK_TIMEOUT
            - MANDATE_INVALID
            - CARD_EXPIRED
            - RISK_DECLINE
            - CUSTOMER_ABANDONED
        is_retryable_same_rail:
          type: boolean
        is_retryable_alternative_rail:
          type: boolean
        rationale:
          type: string
          maxLength: 400
          description: |
            Refused if it contains a percentage or a decimal figure. A model
            asked about decline codes volunteers failure rates unprompted, and
            ADR-0006 kind three forbids writing those at all.
        specification_to_check:
          type: string
          maxLength: 200
          description: |
            The document that would settle the question. No confidence value is
            requested from the model; a human who checks the specification sets
            one.

    TriageResponse:
      type: object
      required:
        - provider_error_code
        - current_mapping
        - proposal
        - status
        - applied
        - model
        - prompt_sha256
        - generated_at
      properties:
        provider_error_code:
          type: string
        provider_error_description:
          type: [string, "null"]
        current_mapping:
          type: string
          description: What the deterministic mapper says today, always UNKNOWN here.
        proposal:
          $ref: "#/components/schemas/TriageProposal"
        status:
          type: string
          const: PROPOSED_PENDING_HUMAN_REVIEW
        applied:
          const: false
          description: |
            A literal rather than a boolean. This field cannot serialise as
            true, which is a stronger statement than a boolean that happens to
            be false today.
        model:
          type: string
        prompt_sha256:
          type: string
        generated_at:
          type: string
          format: date-time
        queued_to:
          type: [string, "null"]

    NudgeRequest:
      type: object
      required:
        - merchant_display_name
        - amount_paise
        - language
        - channel
        - taxonomy_code
      properties:
        merchant_display_name:
          type: string
          maxLength: 80
        amount_paise:
          type: integer
          minimum: 1
        language:
          type: string
          enum: [en, hi, ta, bn, mr]
        channel:
          type: string
          enum: [WHATSAPP, SMS, EMAIL]
        taxonomy_code:
          type: string
          maxLength: 40
        include_payment_link:
          type: boolean
          default: false
      description: |
        There is deliberately no field for a customer name, phone number, email
        or id. This is the only part of Salvage that sends text to a third
        party, and who is being messaged is not needed to write a sentence.

    NudgeCopy:
      type: object
      required:
        - template
        - rendered
        - language
        - channel
        - amount_paise
        - rendered_amount
        - placeholders
        - model
        - prompt_sha256
        - generated_at
        - sent
      properties:
        template:
          type: string
          description: The model's output, containing placeholders and no digits.
        rendered:
          type: string
          description: The template with the service's own values substituted.
        language:
          type: string
        channel:
          type: string
        amount_paise:
          type: integer
        rendered_amount:
          type: string
        placeholders:
          type: array
          items:
            type: string
        model:
          type: string
        prompt_sha256:
          type: string
        generated_at:
          type: string
          format: date-time
        sent:
          type: boolean
          description: Always false. Generating copy is not sending it.

    NarrationRequest:
      type: object
      required: [merchant_id, payment_attempt_id]
      properties:
        merchant_id:
          type: string
        payment_attempt_id:
          type: string

    Narration:
      type: object
      required: [payment_attempt_id, narration, model, prompt_sha256, generated_at]
      properties:
        payment_attempt_id:
          type: string
        narration:
          type: string
        model:
          type: string
        prompt_sha256:
          type: string
          description: |
            SHA-256 of the exact prompt. Provenance rather than replay: a hosted
            model cannot be rerun to the same output, so the artifact records
            what it was asked instead of pretending it can.
        generated_at:
          type: string
          format: date-time
