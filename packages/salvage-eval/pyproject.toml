[project]
name = "salvage-eval"
version = "0.1.0"
description = "Off-policy evaluation harness for payment recovery policies, with classical estimators, diagnostics, and regret accounting."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "numpy>=2.2.0,<3.0",
    "scipy>=1.15.0,<2.0",
    "pydantic>=2.10.0,<3.0",
    "pyyaml>=6.0.2,<7.0",
    "salvage-sim",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
salvage-eval = "salvage_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0",
    "hypothesis>=6.120.0,<7.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12,<7.0",
]

[tool.uv.sources]
salvage-sim = { path = "../salvage-sim", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salvage_eval"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/salvage_eval/benchmark/reporter.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["salvage_eval", "salvage_sim"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

